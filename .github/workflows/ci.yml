name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Build (-Wall -Wextra -Werror -std=c++98)
        run: make re CXX=${{ matrix.cxx }}
      - name: Binary was produced
        run: test -x ircserv

  sanitize:
    name: verification harness (ASan/UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: clang++ --version
      - name: Build verify harness (ASan + UBSan)
        run: make -C verify verify
      - name: Run all checks (Message/Reply property + StringUtil/Client/Channel/IrcException units)
        env:
          UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: abort_on_error=1
        run: ./verify/verify all
      - name: Startup OOM rollback (every construction allocation point)
        run: make -C verify oom && ./verify/oom

  fuzz:
    name: fuzz parse/extractLine (libFuzzer)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install clang (libFuzzer runtime)
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build fuzz target (fuzzer+ASan+UBSan)
        run: make -C verify fuzz
      - name: Fuzz byte-facing code (time-boxed, crash => fail)
        env:
          UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: abort_on_error=1
        run: >
          ./verify/fuzz -max_total_time=30 -rss_limit_mb=2048
          -artifact_prefix=verify/ verify/corpus
      - name: Upload crash reproducers on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          if-no-files-found: ignore
          path: |
            verify/crash-*
            verify/oom-*
            verify/timeout-*
            verify/leak-*
            verify/slow-unit-*

  integration:
    name: integration smoke + ASan/UBSan server (N14/N8 + all-command E2E)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build sanitized server (ASan + UBSan)
        run: make -C verify ircserv_asan
      - name: Smoke + per-command E2E under ASan/UBSan
        env:
          IRCSERV_BIN: verify/ircserv_asan
          IRC_TEST_REGISTRATION: "1"
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
        run: python3 verify/integration.py
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-server-log
          if-no-files-found: ignore
          path: verify/server.log

  server-coverage:
    name: server coverage report (commands/IO layer, informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM coverage tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Build coverage-instrumented server
        run: make -C verify ircserv_cov
      - name: Run integration to exercise the server, then report coverage
        env:
          IRCSERV_BIN: verify/ircserv_cov
          IRC_TEST_REGISTRATION: "1"
          LLVM_PROFILE_FILE: ircserv.profraw
        run: |
          set -euo pipefail
          python3 verify/integration.py
          llvm-profdata merge ircserv.profraw -o ircserv.profdata
          llvm-cov report ./verify/ircserv_cov -instr-profile=ircserv.profdata \
            src/Server.cpp src/Socket.cpp src/CommandDispatcher.cpp src/ACommand.cpp \
            src/commands/*.cpp | tee server_cov.txt
      - name: Upload server coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage-report
          if-no-files-found: ignore
          path: |
            server_cov.txt
            verify/server.log

  coverage:
    name: coverage gate (pure logic region+line+branch+mcdc 100%)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM coverage tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Build coverage harness
        run: make -C verify verify_cov
      - name: Gate 1 — pure logic全ファイルを region+line+branch+mcdc=100% で機械検査
        working-directory: verify
        run: |
          set -euo pipefail
          FILES="../src/Message.cpp ../src/Reply.cpp ../src/StringUtil.cpp \
                 ../src/Client.cpp ../src/IrcException.cpp \
                 ../src/Channel/Channel.cpp ../src/Channel/Channel_members.cpp \
                 ../src/Channel/Channel_operator.cpp ../src/Channel/Channel_invite.cpp \
                 ../src/Channel/Channel_topic.cpp ../src/Channel/Channel_mode.cpp \
                 ../src/Channel/Channel_broadcast.cpp"
          LLVM_PROFILE_FILE=all.profraw ./verify_cov all >/dev/null
          llvm-profdata merge all.profraw -o all.profdata
          llvm-cov export ./verify_cov -instr-profile=all.profdata $FILES > cov.json
          python3 coverage_gate.py cov.json
      - name: Gate 2 — パーサ全数テスト＋RFC境界テストで Message.cpp を 100% 網羅
        working-directory: verify
        run: |
          set -euo pipefail
          LLVM_PROFILE_FILE=ex.profraw ./verify_cov exhaustive 12 >/dev/null
          LLVM_PROFILE_FILE=parser.profraw ./verify_cov parser >/dev/null
          llvm-profdata merge ex.profraw parser.profraw -o ex.profdata
          llvm-cov export ./verify_cov -instr-profile=ex.profdata ../src/Message.cpp > cov_parser.json
          python3 coverage_gate.py cov_parser.json
      - name: Upload coverage export on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          if-no-files-found: ignore
          path: |
            verify/cov.json
            verify/cov_parser.json

  static-analysis:
    name: static analysis (cppcheck + clang-tidy/analyzer)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck + clang-tidy
        run: sudo apt-get update && sudo apt-get install -y cppcheck clang-tidy
      - name: cppcheck (warning/performance/portability を error 扱い)
        run: |
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=2 --std=c++03 --language=c++ \
            --inline-suppr --quiet -I include src
      - name: clang-tidy (clang static analyzer + bugprone, WarningsAsErrors)
        run: |
          clang-tidy $(find src -name '*.cpp' | sort) \
            -- -std=c++98 -I include -I include/commands
